<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge-TTS Studio | 神经网络语音合成控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.tailwind) window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        edge: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }
        /* 自定义滑块样式 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155;
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #7dd3fc;
        }
        input[type=range]::-moz-range-track {
            height: 6px;
            background: #334155;
            border-radius: 999px;
        }
        input[type=range]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: 0;
            border-radius: 50%;
            background: #38bdf8;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .studio-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: stretch;
        }
        .voice-panel, .workbench-panel {
            min-width: 0;
        }
        .voice-list {
            max-height: 24rem;
            max-height: clamp(12rem, 45dvh, 24rem);
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
        }
        .voice-card {
            border-color: #334155;
            background-color: rgba(15, 23, 42, 0.55);
        }
        .voice-card:hover, .voice-card:focus-visible {
            border-color: #64748b;
        }
        .voice-card[aria-pressed="true"] {
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.12);
        }
        .gender-btn[aria-pressed="true"] {
            background-color: #0ea5e9;
            color: #fff;
        }
        .cat-chip[aria-pressed="true"] {
            background-color: rgba(14, 165, 233, 0.2);
            box-shadow: inset 0 0 0 1px rgba(14, 165, 233, 0.35);
            color: #7dd3fc;
        }
        .prosody-grid {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr));
        }
        @media (min-width: 64rem) {
            .studio-layout {
                grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
            }
            .voice-list {
                flex: 1;
                max-height: none;
                contain: size;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-30 glass-panel border-b border-slate-800/80 px-4 lg:px-8 py-3.5">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i data-lucide="audio-waveform" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-sky-400 bg-clip-text text-transparent">
                            Edge TTS Studio
                        </h1>
                    </div>
                    <p class="text-xs text-slate-400">浏览微软 Edge 音色、调节语音参数并在线合成</p>
                </div>
            </div>

            <!-- Voice statistics -->
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-4 bg-slate-900/90 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-slate-400">语言与地区</span>
                        <span id="stat-locales" class="font-bold text-white font-mono">--</span>
                    </div>
                    <div class="h-3 w-px bg-slate-800"></div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="mic" class="w-3.5 h-3.5 text-sky-400"></i>
                        <span class="text-slate-400">可用音色:</span>
                        <span id="stat-voices" class="font-bold text-white font-mono">--</span>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="studio-layout max-w-7xl w-full mx-auto p-4 lg:p-6 gap-4 lg:gap-6">
        
        <!-- Voice catalog -->
        <section class="voice-panel flex flex-col glass-panel rounded-2xl overflow-hidden">
            <!-- 搜索与过滤头部 -->
            <div class="p-4 border-b border-slate-800/80 space-y-3 bg-slate-900/50">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="text-sm font-semibold flex items-center gap-2 text-slate-200">
                        <i data-lucide="globe-2" class="w-4 h-4 text-sky-400"></i>
                        <span>支持的语言与语音库 (Voices)</span>
                    </h2>
                    <button id="btn-sync-voices" title="从微软官方接口同步全部 320+ 语音" 
                            class="text-xs flex items-center gap-1 text-sky-400 hover:text-sky-300 bg-sky-500/10 hover:bg-sky-500/20 disabled:opacity-60 px-2.5 py-1 rounded-lg transition">
                        <i data-lucide="refresh-cw" class="w-3 h-3" id="sync-icon"></i>
                        <span id="sync-text">同步云端完整列表</span>
                    </button>
                </div>

                <!-- 关键字搜索框 -->
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="search" id="voice-search" aria-label="搜索音色" placeholder="搜索语言、地区、ShortName (如 Xiaoxiao, zh-CN, ja-JP)..."
                           class="w-full bg-slate-950/90 border border-slate-800 focus:border-sky-500 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none transition">
                </div>

                <!-- 筛选器行 -->
                <div class="grid grid-cols-12 gap-2">
                    <!-- 语言/地区下拉选择 -->
                    <div class="col-span-7">
                        <select id="locale-filter" aria-label="按语言或地区筛选" class="w-full bg-slate-950/90 border border-slate-800 focus:border-sky-500 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none">
                            <option value="ALL">🌍 所有语言与地区 (All Locales)</option>
                        </select>
                    </div>
                    <!-- 性别筛选 -->
                    <div class="col-span-5 flex bg-slate-950/90 p-0.5 rounded-xl border border-slate-800">
                        <button data-gender="ALL" aria-pressed="true" class="gender-btn flex-1 text-xs py-1 rounded-lg text-slate-400 hover:text-slate-200 transition">全部</button>
                        <button data-gender="Female" class="gender-btn flex-1 text-xs py-1 rounded-lg text-slate-400 hover:text-slate-200 transition">女声</button>
                        <button data-gender="Male" class="gender-btn flex-1 text-xs py-1 rounded-lg text-slate-400 hover:text-slate-200 transition">男声</button>
                    </div>
                </div>

                <!-- 分类标签筛选 (ContentCategories / VoicePersonalities) -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-[11px]" id="category-chips">
                    <button data-cat="ALL" aria-pressed="true" class="cat-chip shrink-0 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-400 hover:text-slate-200">全部特性</button>
                    <button data-cat="Multilingual" class="cat-chip shrink-0 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-400 hover:text-slate-200">🔥 多语言混合 (Multilingual)</button>
                    <button data-cat="Conversation" class="cat-chip shrink-0 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-400 hover:text-slate-200">自然对话</button>
                    <button data-cat="News" class="cat-chip shrink-0 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-400 hover:text-slate-200">新闻播报</button>
                    <button data-cat="Novel" class="cat-chip shrink-0 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-400 hover:text-slate-200">小说故事</button>
                    <button data-cat="Dialect" class="cat-chip shrink-0 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-400 hover:text-slate-200">特色方言</button>
                </div>
            </div>

            <!-- 语音列表滚动容器 -->
            <div id="voice-list-container" class="voice-list p-3 space-y-2">
                <!-- 动态渲染语音卡片 -->
            </div>

            <!-- 底部列表状态栏 -->
            <div class="px-4 py-2.5 bg-slate-900/80 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
                <span>当前筛选结果: <strong id="filtered-count" class="text-slate-200">0</strong> 个音色</span>
                <span class="min-w-0 break-all font-mono text-[11px] text-sky-400" id="current-selected-badge">zh-CN-XiaoxiaoNeural</span>
            </div>
        </section>

        <!-- Synthesis controls and player -->
        <section class="workbench-panel glass-panel rounded-2xl">
            
            <!-- Prosody controls -->
            <div class="p-4 sm:p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-sky-400"></i>
                        <h2 class="text-sm font-semibold text-slate-200">合成参数</h2>
                    </div>
                    <button id="btn-reset-params" class="text-xs text-slate-400 hover:text-sky-400 flex items-center gap-1 transition">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        <span>恢复默认</span>
                    </button>
                </div>

                <!-- 三个核心可调参数滑块 -->
                <div class="prosody-grid grid gap-3">
                    <!-- Rate 语速控制 -->
                    <div class="bg-slate-900/70 border border-slate-800/90 rounded-xl p-3.5 space-y-2">
                        <div class="flex items-center justify-between">
                            <label for="param-rate" class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                                <i data-lucide="gauge" class="w-3.5 h-3.5 text-sky-400"></i>
                                <span>语速</span>
                            </label>
                            <span id="val-rate" class="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">+0%</span>
                        </div>
                        <input type="range" id="param-rate" min="-100" max="100" step="5" value="0" class="w-full">
                        <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                            <span>-100% (慢)</span>
                            <span>+100% (快)</span>
                        </div>
                    </div>

                    <!-- Volume 音量控制 -->
                    <div class="bg-slate-900/70 border border-slate-800/90 rounded-xl p-3.5 space-y-2">
                        <div class="flex items-center justify-between">
                            <label for="param-volume" class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                                <i data-lucide="volume-2" class="w-3.5 h-3.5 text-emerald-400"></i>
                                <span>音量</span>
                            </label>
                            <span id="val-volume" class="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">+0%</span>
                        </div>
                        <input type="range" id="param-volume" min="-100" max="100" step="5" value="0" class="w-full">
                        <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                            <span>-100% (轻)</span>
                            <span>+100% (响)</span>
                        </div>
                    </div>

                    <!-- Pitch 音调控制 -->
                    <div class="bg-slate-900/70 border border-slate-800/90 rounded-xl p-3.5 space-y-2">
                        <div class="flex items-center justify-between">
                            <label for="param-pitch" class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                                <i data-lucide="music" class="w-3.5 h-3.5 text-purple-400"></i>
                                <span>音调</span>
                            </label>
                            <span id="val-pitch" class="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20">+0Hz</span>
                        </div>
                        <input type="range" id="param-pitch" min="-100" max="100" step="5" value="0" class="w-full">
                        <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                            <span>-100Hz (低沉)</span>
                            <span>+100Hz (高亢)</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 2. 文本输入与语音合成播放器区域 -->
            <div class="border-t border-slate-800/80 p-4 sm:p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <i data-lucide="message-square-text" class="w-4 h-4 text-sky-400"></i>
                        <h2 class="text-sm font-semibold text-slate-200">合成文本与在线试听</h2>
                    </div>

                    <!-- Sample text shortcuts -->
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-[11px] text-slate-400 mr-1">填入示例文本</span>
                        <button data-sample="zh" class="sample-btn text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">🇨🇳 中文普通话</button>
                        <button data-sample="hk" class="sample-btn text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-500/30 transition">🇭🇰 香港粤语</button>
                        <button data-sample="en" class="sample-btn text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">🇺🇸 英文科技</button>
                        <button data-sample="ja" class="sample-btn text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">🇯🇵 日语动漫</button>
                        <button data-sample="multi" class="sample-btn text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">🌐 多语种混读</button>
                    </div>
                </div>
                <p class="text-[11px] text-slate-400">选择音色时按语言填入匹配示例。多语种混读可手动填入。</p>

                <div class="flex flex-wrap items-center gap-2 rounded-xl border border-slate-800 bg-slate-900/50 px-3 py-2">
                    <div class="min-w-0 flex-1 basis-40">
                        <div class="flex flex-wrap items-baseline gap-x-2 text-xs">
                            <span class="text-slate-400">当前音色</span>
                            <strong id="synthesis-voice-name" class="break-words text-slate-200"></strong>
                        </div>
                        <input id="synthesis-voice-id" type="text" readonly aria-label="当前音色 ShortName"
                               class="w-full rounded bg-transparent py-1 font-mono text-xs text-sky-300">
                    </div>
                    <button id="btn-copy-voice-id" type="button" disabled
                            class="flex shrink-0 items-center gap-1.5 rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs text-slate-200 hover:bg-slate-700 disabled:opacity-40">
                        <i data-lucide="copy" class="h-3.5 w-3.5" aria-hidden="true"></i>
                        <span>复制 ID</span>
                    </button>
                </div>

                <!-- 文本编辑框 -->
                <div>
                    <textarea id="tts-text" rows="4" aria-label="合成文本"
                              class="w-full bg-slate-950/90 border border-slate-800 focus:border-sky-500 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition resize-y leading-relaxed"
                              placeholder="在此输入需要转换为语音的文字内容...">欢迎使用 Edge-TTS 语音合成控制台！你可以通过左侧列表自由切换全球上百种语言和神经网络音色，并通过上方滑块实时调节语速、音量与音调。</textarea>
                    <div class="flex items-center justify-end gap-3 pt-1 text-[11px] text-slate-400">
                        <span id="char-counter">69 字符</span>
                        <button id="btn-clear-text" class="hover:text-rose-400 transition" title="清空文本">清空</button>
                    </div>
                </div>

                <!-- 操作控制栏与音频可视化播放器 -->
                <div class="flex flex-wrap items-stretch justify-between gap-3 pt-1">
                    <div class="flex flex-wrap items-center gap-2.5">
                        <button id="btn-synthesize" 
                                class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-semibold text-sm shadow-lg shadow-sky-500/25 transition active:scale-95">
                            <i data-lucide="play" class="w-4 h-4 fill-current" id="play-btn-icon"></i>
                            <span id="play-btn-text">生成并播放语音</span>
                        </button>

                        <button id="btn-stop" disabled
                                class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-rose-500/20 hover:text-rose-300 hover:border-rose-500/30 disabled:opacity-40 disabled:pointer-events-none text-slate-300 border border-slate-700 text-sm font-medium flex items-center gap-1.5 transition">
                            <i data-lucide="square" class="w-4 h-4 fill-current"></i>
                            <span>停止</span>
                        </button>
                    </div>

                    <!-- 下载音频与下载字幕按钮 -->
                    <div class="flex flex-wrap items-center gap-2">
                        <button id="btn-download-mp3" disabled
                                class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none text-xs font-medium text-sky-300 border border-slate-700 transition">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                            <span>下载 MP3</span>
                        </button>
                        <button id="btn-download-vtt" title="优先使用合成时间点，缺少时间点时按文本估算"
                                class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-xs font-medium text-emerald-300 border border-slate-700 transition">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                            <span>导出 WebVTT 字幕</span>
                        </button>
                    </div>
                </div>

                <!-- 音频波形与原生 Audio 播放器容器 -->
                <div class="bg-slate-950/90 border border-slate-800/90 rounded-xl p-3.5 space-y-2.5">
                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div class="flex min-w-0 items-center gap-2">
                            <span id="status-dot" aria-hidden="true" class="w-2 h-2 shrink-0 rounded-full bg-slate-500"></span>
                            <span id="status-message" role="status" class="min-w-0 break-words text-slate-300 font-medium">就绪，点击「生成并播放语音」开始合成</span>
                        </div>
                        <span id="WordBoundary-display" class="text-sky-400 font-mono text-xs truncate max-w-[220px]"></span>
                    </div>

                    <!-- 动态音频频谱 Canvas -->
                    <div class="relative h-14 w-full bg-slate-900/80 rounded-lg overflow-hidden border border-slate-800/60 flex items-center justify-center">
                        <canvas id="waveform-canvas" class="w-full h-full block"></canvas>
                    </div>

                    <!-- HTML5 Audio 控件 (当获取到 MP3 Blob 时可拖动进度) -->
                    <audio id="audio-player" controls class="w-full h-8 hidden"></audio>
                </div>
            </div>

        </section>
    </main>

    <!-- 全局非阻塞通知提示框 -->
    <div id="toast-container" class="fixed bottom-5 left-4 right-4 sm:left-auto sm:right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <script id="edge-tts-app">
        /**
         * ============================================================================
         * 1. 内置完整的 edge-tts 多语言与音色精选数据库 (涵盖全球主要语种及所有热门 Neural 语音)
         *    并且支持点击按钮实时从微软 Edge 官方接口拉取全量 320+ 语音列表
         * ============================================================================

        // Format signed prosody values for SSML.
        function formatSignedParam(val, unit) {
            const num = parseInt(val, 10) || 0;
            return (num >= 0 ? `+${num}` : `${num}`) + unit;
        }

        // 更新顶部统计与语言下拉框
        function populateLocaleDropdown() {
            const select = document.getElementById("locale-filter");
            const currentVal = select.value;
            const localeSet = new Set(state.voices.map(v => v.Locale));
            const sortedLocales = Array.from(localeSet).sort((a, b) => {
                // 让中文和英文排在前面方便选择
                if (a.startsWith("zh") && !b.startsWith("zh")) return -1;
                if (!a.startsWith("zh") && b.startsWith("zh")) return 1;
                if (a.startsWith("en") && !b.startsWith("en")) return -1;
                if (!a.startsWith("en") && b.startsWith("en")) return 1;
                return a.localeCompare(b);
            });

            select.innerHTML = `<option value="ALL">🌍 所有语言与地区 (${sortedLocales.length} 项 / ${state.voices.length} 音色)</option>`;
            sortedLocales.forEach(loc => {
                const count = state.voices.filter(v => v.Locale === loc).length;
                const readable = LOCALE_NAME_MAP[loc] || state.voices.find(v => v.Locale === loc)?.LocaleName || loc;
                const option = document.createElement("option");
                option.value = loc;
                option.textContent = `${loc} — ${readable} (${count})`;
                select.appendChild(option);
            });

            state.filterLocale = sortedLocales.includes(currentVal) ? currentVal : "ALL";
            select.value = state.filterLocale;

            document.getElementById("stat-locales").textContent = sortedLocales.length;
            document.getElementById("stat-voices").textContent = state.voices.length;

        function renderFilterSelection() {

        // Render the filtered voice catalog.
        function renderVoiceList({ selectFirst = false } = {}) {
            const container = document.getElementById("voice-list-container");
            const search = state.filterSearch.trim().toLowerCase();

            const filtered = state.voices.filter(v => {
                if (state.filterLocale !== "ALL" && v.Locale !== state.filterLocale) return false;
                if (state.filterGender !== "ALL" && v.Gender !== state.filterGender) return false;
                if (state.filterCategory !== "ALL") {
                    const isMulti = v.ShortName.toLowerCase().includes("multilingual") || (v.Categories && v.Categories.includes("Multilingual"));
                    const isDialect = v.Locale.split("-").length > 2 || v.Locale === "zh-HK" || (v.Categories && v.Categories.includes("Dialect"));
                    if (state.filterCategory === "Multilingual" && !isMulti) return false;
                    else if (state.filterCategory === "Dialect" && !isDialect) return false;
                    else if (state.filterCategory !== "Multilingual" && state.filterCategory !== "Dialect") {
                        if (!v.Categories || !v.Categories.some(c => c.toLowerCase().includes(state.filterCategory.toLowerCase()))) return false;
                    }
                }
                if (search) {
                    const hay = `${v.ShortName} ${v.FriendlyName} ${v.Locale} ${LOCALE_NAME_MAP[v.Locale] || ""} ${(v.Categories || []).join(" ")}`.toLowerCase();
                    if (!hay.includes(search)) return false;
                }
                return true;
            });

            document.getElementById("filtered-count").textContent = filtered.length;
            const previousVoice = state.selectedVoice;
            const retainedVoice = selectFirst ? null : filtered.find(voice => voice.ShortName === previousVoice?.ShortName);
            const nextVoice = retainedVoice ?? filtered[0] ?? null;
            const syncSample = state.selectedSample !== null && nextVoice?.ShortName !== previousVoice?.ShortName;
            selectVoice(nextVoice, syncSample);
            if (selectFirst) container.scrollTop = 0;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="h-48 flex flex-col items-center justify-center text-slate-500 text-xs space-y-2">
                        <p>未找到匹配的语音音色</p>
                        <button id="btn-reset-filter" class="px-3 py-1 rounded-lg bg-slate-800 text-sky-400 hover:bg-slate-700">清除筛选条件</button>
                    </div>
                `;
                document.getElementById("btn-reset-filter")?.addEventListener("click", () => {
                    state.filterSearch = "";
                    state.filterLocale = "ALL";
                    state.filterGender = "ALL";
                    state.filterCategory = "ALL";
                    const searchInput = document.getElementById("voice-search");
                    searchInput.value = "";
                    document.getElementById("locale-filter").value = "ALL";
                    renderFilterSelection();
                    renderVoiceList({ selectFirst: true });

            container.innerHTML = filtered.map(v => {
                const isSelected = nextVoice.ShortName === v.ShortName;
                const genderBadge = v.Gender === "Female" 
                    ? `<span class="px-1.5 py-0.5 rounded text-[10px] bg-pink-500/15 text-pink-300 border border-pink-500/25">♀ 女声</span>`
                    : `<span class="px-1.5 py-0.5 rounded text-[10px] bg-blue-500/15 text-blue-300 border border-blue-500/25">♂ 男声</span>`;
                
                const tags = (v.Categories || []).slice(0, 3).map(cat => 
                    `<span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400">${escapeXml(cat)}</span>`
                ).join("");

                return `
                    <button type="button" data-voice="${escapeXml(v.ShortName)}" aria-pressed="${isSelected}" class="voice-card block w-full cursor-pointer rounded-xl p-3 text-left transition border">
                        <span class="flex items-start justify-between gap-2">
                            <span class="min-w-0">
                                <span class="block break-words text-xs font-semibold text-slate-100">${escapeXml(v.FriendlyName)}</span>
                                <span class="block break-all text-[11px] font-mono text-sky-400 mt-0.5">${escapeXml(v.ShortName)}</span>
                            </span>
                            ${genderBadge}
                        </span>
                        <span class="flex flex-wrap items-center justify-between gap-1 mt-2 pt-2 border-t border-slate-800/60 text-[10px] text-slate-400">
                            <span>${escapeXml(LOCALE_NAME_MAP[v.Locale] || v.LocaleName || v.Locale)}</span>
                            <span class="flex flex-wrap items-center gap-1">${tags}</span>
                        </span>

            // 绑定点击选择语音事件

                card.addEventListener("click", () => {

                    const found = state.voices.find(item => item.ShortName === shortName);
                    if (found) {

        function escapeXml(value) {
            const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&apos;", '"': "&quot;" };
            return value.replace(/[&<>'"]/g, character => entities[character]);
        }

        /**
         * ============================================================================
         * 5. Refresh the Microsoft Edge voice catalog
         * ============================================================================
         */
        async function syncAllCloudVoices() {
            const button = document.getElementById("btn-sync-voices");
            if (button.disabled) return;
            button.disabled = true;
            const icon = document.getElementById("sync-icon");
            const text = document.getElementById("sync-text");
            icon.classList.add("animate-spin");
            text.textContent = "Syncing...";

            try {
                const url = `https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/voices/list?trustedclienttoken=${EDGE_CLIENT_TOKEN}`;
                const res = await fetch(url, { signal: AbortSignal.timeout(12000) });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error("Invalid Edge voice catalog");
                const voices = data.filter(item => item && typeof item.ShortName === "string"
                    && /^[A-Za-z0-9]+(?:-[A-Za-z0-9]+){2,}$/.test(item.ShortName)
                    && typeof item.Locale === "string" && /^[A-Za-z]{2,3}(?:-[A-Za-z0-9]+)*$/.test(item.Locale)
                    && typeof item.FriendlyName === "string").map(item => ({
                    ShortName: item.ShortName,
                    FriendlyName: item.FriendlyName.replace("Microsoft ", "").replace(" Online (Natural)", ""),
                    Locale: item.Locale,
                    Gender: item.Gender,
                    Categories: Array.isArray(item.VoiceTag?.ContentCategories)
                        ? item.VoiceTag.ContentCategories.filter(category => typeof category === "string") : ["General"]
                }));
                if (!voices.length) throw new Error("The Edge voice catalog is empty");
                const selected = state.selectedVoice;
                state.voices = voices;
                populateLocaleDropdown();
                renderVoiceList();
                if (selected && !voices.some(voice => voice.ShortName === selected.ShortName)) {
                    showToast(`${selected.ShortName} is missing from the refreshed catalog.`, "warning");
                }
                showToast(`Edge voice catalog refreshed (${state.voices.length} voices)`, "success");
                text.textContent = `Synced (${state.voices.length})`;
            } catch (err) {
                showToast("Could not refresh the Edge voice catalog. The previous list is still available.", "warning");
                text.textContent = `Voice catalog (${state.voices.length})`;
            } finally {
                button.disabled = false;
                icon.classList.remove("animate-spin");
            }
        }

        /**
         * ============================================================================
         * 6. Edge TTS synthesis
         * ============================================================================
         */
        const EDGE_CLIENT_TOKEN = "6A5AA1D4EAFF4E9FB37E23D68491D6F4";
        async function requestSynthesis(text, voice, rate, volume, pitch, signal) {
            const endpoint = new URL("../api/edge-tts", window.location.href);
            const localPageMessage = "Open this tool through the local Vite server to synthesize audio.";
            if (endpoint.protocol === "file:") throw new Error(localPageMessage);
            let response;
            try {
                response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text, voice, rate, volume, pitch }),
                    signal
                });
            } catch (error) {
                if (signal.aborted) throw error;
                throw new Error("The synthesis service could not be reached.");
            }
            const result = await response.json().catch(() => null);
            if (!response.ok) {
                if (!result && [404, 405].includes(response.status)) {
                    throw new Error(localPageMessage);
                }
                throw new Error(result?.error || "The synthesis request failed.");
            }
            if (result?.voice !== voice || typeof result.audio !== "string" || !result.audio || !Array.isArray(result.cues)) {
                throw new Error("The synthesis service returned an invalid result for the selected voice.");
            }
            const binary = atob(result.audio);
            const audio = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index++) audio[index] = binary.charCodeAt(index);
            return { blob: new Blob([audio], { type: "audio/mpeg" }), cues: result.cues };
        }

        // Estimate subtitle timing when no real word boundaries are available.
        function generateEstimatedSubtitles(text, ratePercent) {
            const speedFactor = Math.max(0.3, 1 + ratePercent / 100);
            const clauses = text.split(/([，。！？；,.!?;：\n]+)/).reduce((acc, cur, idx, arr) => {
                if (idx % 2 === 0 && cur.trim()) {
                    const punct = arr[idx + 1] || "";
                    acc.push((cur + punct).trim());
                }
                return acc;
            }, []);
            if (!clauses.length && text.trim()) clauses.push(text.trim());

            let currentMs = 0;
            return clauses.map(clause => {
                const durationMs = Math.max(800, Math.round((clause.length * 220) / speedFactor));
                const item = {
                    offset: currentMs,
                    duration: durationMs,
                    text: clause
                };
                currentMs += durationMs + 150;
                return item;
            });
        }

        function formatVttTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const millis = Math.floor(ms % 1000);
            const hrs = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;
            return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
        }

        // Only the current request may publish results.
        async function handleSynthesizeAndPlay() {
            const voice = state.selectedVoice;
            if (!voice) {
                setSynthesizingUI(false, noMatchingVoiceMessage);
                showToast(noMatchingVoiceMessage, "error");
                return;
            }
            const text = document.getElementById("tts-text").value.trim();
            if (!text) {
                showToast("Enter text to synthesize.", "warning");
                return;
            }

            stopAllPlayback();
            clearAudioResult();
            const controller = new AbortController();
            const { signal } = controller;
            state.synthesisController = controller;
            const { rate, volume, pitch } = state;
            const synthesis = { text, voice, rate, volume, pitch, estimated: true, extension: null };
            const rateStr = formatSignedParam(rate, "%");
            const volumeStr = formatSignedParam(volume, "%");
            const pitchStr = formatSignedParam(pitch, "Hz");

            setSynthesizingUI(true, `Requesting Edge TTS [${voice.ShortName}]...`);
            try {
                const { blob, cues } = await requestSynthesis(text, voice.ShortName, rateStr, volumeStr, pitchStr, signal);
                if (signal.aborted || state.synthesisController !== controller) return;
                synthesis.estimated = cues.length === 0;
                state.subtitlesCueList = synthesis.estimated ? generateEstimatedSubtitles(text, rate) : cues;
                await playAudioBlob(blob, `Edge TTS ready [${voice.ShortName}]`, synthesis, signal);
            } catch (error) {
                if (signal.aborted || state.synthesisController !== controller) return;
                stopVisualizer();
                const message = `Synthesis failed for ${voice.ShortName}: ${error.message}`;
                setSynthesizingUI(false, message);
                showToast(message, "error");
            }
        }

        async function playAudioBlob(blob, statusMsg, synthesis, signal) {
            signal?.throwIfAborted();
            const extensions = { "audio/mpeg": "mp3", "audio/mp3": "mp3", "audio/wav": "wav", "audio/x-wav": "wav", "audio/ogg": "ogg" };
            const extension = extensions[blob.type.split(";")[0].toLowerCase()];
            if (!extension) throw new Error("Unsupported audio format");
            if (state.lastAudioBlobUrl) {
                URL.revokeObjectURL(state.lastAudioBlobUrl);
            }
            const url = URL.createObjectURL(blob);
            state.lastAudioBlobUrl = url;
            synthesis.extension = extension;
            state.lastSynthesis = synthesis;
            const audioEl = document.getElementById("audio-player");
            audioEl.src = url;
            audioEl.classList.remove("hidden");
            document.getElementById("btn-download-mp3").disabled = false;
            document.getElementById("btn-download-mp3").querySelector("span").textContent = `Download ${extension.toUpperCase()}`;
            const isCurrentMedia = () => state.lastAudioBlobUrl === url && state.lastSynthesis === synthesis;

            audioEl.onplaying = () => {
                if (!isCurrentMedia() || audioEl.paused) return;
                startVisualizer();
                setSynthesizingUI(true, statusMsg);
            };
            audioEl.onpause = () => {
                if (!isCurrentMedia() || !state.isSynthesizing) return;
                stopVisualizer();
                setSynthesizingUI(false, "Audio paused");
            };
            audioEl.onended = () => {
                if (!isCurrentMedia()) return;
                stopVisualizer();
                setSynthesizingUI(false, "Audio playback complete");
            };
            audioEl.onerror = () => {
                if (!isCurrentMedia()) return;
                stopVisualizer();
                setSynthesizingUI(false, "Audio playback failed. The audio could not be loaded or decoded.");
            };
            audioEl.ontimeupdate = () => {
                if (!isCurrentMedia()) return;
                const time = audioEl.currentTime * 1000;
                const cue = state.subtitlesCueList.find(item => time >= item.offset && time < item.offset + item.duration);
                document.getElementById("WordBoundary-display").textContent = cue?.text || "";
            };

            try {
                await audioEl.play();
            } catch (error) {
                if (!isCurrentMedia() || signal?.aborted) return;
                stopVisualizer();
                setSynthesizingUI(false, `Playback could not start: ${error.message}. Use the audio controls to retry.`);
                showToast("Playback could not start. Use the audio controls to retry or download the audio.", "warning");
            }
        }

        function clearAudioResult() {
            const audioEl = document.getElementById("audio-player");
            audioEl.onplaying = audioEl.onpause = audioEl.onended = audioEl.onerror = audioEl.ontimeupdate = null;
            audioEl.pause();
            audioEl.removeAttribute("src");
            audioEl.load();
            audioEl.classList.add("hidden");
            if (state.lastAudioBlobUrl) URL.revokeObjectURL(state.lastAudioBlobUrl);
            state.lastAudioBlobUrl = null;
            state.lastSynthesis = null;
            state.subtitlesCueList = [];
            document.getElementById("btn-download-mp3").disabled = true;
            document.getElementById("btn-download-mp3").querySelector("span").textContent = "Download MP3";
            document.getElementById("WordBoundary-display").textContent = "";
        }

        function stopAllPlayback() {
            const controller = state.synthesisController;
            state.synthesisController = null;
            controller?.abort();
            const audioEl = document.getElementById("audio-player");
            audioEl.pause();
            audioEl.currentTime = 0;
            stopVisualizer();
            setSynthesizingUI(false, "Playback stopped");
        }

        function setSynthesizingUI(active, message) {
            state.isSynthesizing = active;
            const dot = document.getElementById("status-dot");
            const msgEl = document.getElementById("status-message");
            const stopBtn = document.getElementById("btn-stop");
            const playBtnText = document.getElementById("play-btn-text");

            msgEl.textContent = message;
            stopBtn.disabled = !active;

            if (active) {
                dot.className = "w-2 h-2 shrink-0 rounded-full bg-emerald-400 animate-ping";
                playBtnText.textContent = "重新合成播放";
            } else {
                dot.className = "w-2 h-2 shrink-0 rounded-full bg-sky-400";
                playBtnText.textContent = "生成并播放语音";
            }
        }

        /**
         * ============================================================================
         * 7. 动态音频频谱可视化 Canvas
         * ============================================================================
         */
        let visualizerActive = false;

        function drawIdleWaveform() {
            const canvas = document.getElementById("waveform-canvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            ctx.clearRect(0, 0, rect.width, rect.height);
            const barCount = 48;
            const gap = 4;
            const barWidth = (rect.width - (barCount - 1) * gap) / barCount;

            for (let i = 0; i < barCount; i++) {
                const h = 4 + Math.sin(i * 0.3) * 2;
                const x = i * (barWidth + gap);
                const y = (rect.height - h) / 2;
                ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
                ctx.beginPath();
                ctx.roundRect(x, y, Math.max(2, barWidth), h, 2);
                ctx.fill();
            }
        }

        function startVisualizer() {
            visualizerActive = true;
            const canvas = document.getElementById("waveform-canvas");
            const ctx = canvas.getContext("2d");
            let phase = 0;

            function renderFrame() {
                if (!visualizerActive) return;
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                ctx.clearRect(0, 0, rect.width, rect.height);
                const barCount = 48;
                const gap = 4;
                const barWidth = (rect.width - (barCount - 1) * gap) / barCount;

                // 根据用户设置的语速、音调和音量改变波形跳动幅度与频率
                const speedMultiplier = 1 + state.rate / 150;
                const ampMultiplier = Math.max(0.3, 1 + state.volume / 120);
                phase += 0.14 * speedMultiplier;

                for (let i = 0; i < barCount; i++) {
                    const wave1 = Math.sin(i * 0.35 + phase);
                    const wave2 = Math.cos(i * 0.2 - phase * 1.3);
                    const normalized = Math.abs(wave1 * wave2);
                    const maxH = rect.height * 0.82 * ampMultiplier;
                    const h = Math.max(5, normalized * maxH);
                    const x = i * (barWidth + gap);
                    const y = (rect.height - h) / 2;

                    const grad = ctx.createLinearGradient(0, y, 0, y + h);
                    grad.addColorStop(0, "#38bdf8");
                    grad.addColorStop(1, "#6366f1");
                    ctx.fillStyle = grad;

                    ctx.beginPath();
                    ctx.roundRect(x, y, Math.max(2, barWidth), h, 3);
                    ctx.fill();
                }

                state.animationId = requestAnimationFrame(renderFrame);
            }

            cancelAnimationFrame(state.animationId);
            renderFrame();
        }

        function stopVisualizer() {
            visualizerActive = false;
            cancelAnimationFrame(state.animationId);
            drawIdleWaveform();
        }

        /**
         * ============================================================================
         * 8. 页面初始化与事件绑定
         * ============================================================================
         */
        window.addEventListener("DOMContentLoaded", () => {
            window.lucide?.createIcons();
            populateLocaleDropdown();
            renderVoiceList();
            renderSampleSelection();
            renderFilterSelection();
            const voiceIdInput = document.getElementById("synthesis-voice-id");
            voiceIdInput.addEventListener("click", () => voiceIdInput.select());
            document.getElementById("btn-copy-voice-id").addEventListener("click", copyVoiceId);
            document.getElementById("char-counter").textContent = `${document.getElementById("tts-text").value.length} characters`;
            drawIdleWaveform();

            window.addEventListener("resize", () => {
                if (!visualizerActive) drawIdleWaveform();
            });

            // 1. 搜索框与语言筛选事件
            document.getElementById("voice-search").addEventListener("input", (e) => {
                state.filterSearch = e.target.value;
                renderVoiceList({ selectFirst: true });
            });

            document.getElementById("locale-filter").addEventListener("change", (e) => {
                state.filterLocale = e.target.value;
                renderVoiceList({ selectFirst: true });
            });

            // 2. 性别切换按钮
            document.querySelectorAll(".gender-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    state.filterGender = btn.getAttribute("data-gender");
                    renderFilterSelection();
                    renderVoiceList({ selectFirst: true });
                });
            });

            // 3. 分类特性标签筛选
            document.querySelectorAll(".cat-chip").forEach(chip => {
                chip.addEventListener("click", () => {
                    state.filterCategory = chip.getAttribute("data-cat");
                    renderFilterSelection();
                    renderVoiceList({ selectFirst: true });
                });
            });

            // 4. 语速、音量、音调滑块控制
            const rateInput = document.getElementById("param-rate");
            const volInput = document.getElementById("param-volume");
            const pitchInput = document.getElementById("param-pitch");

            rateInput.addEventListener("input", (e) => {
                state.rate = parseInt(e.target.value, 10);
                document.getElementById("val-rate").textContent = formatSignedParam(state.rate, "%");
            });

            volInput.addEventListener("input", (e) => {
                state.volume = parseInt(e.target.value, 10);
                document.getElementById("val-volume").textContent = formatSignedParam(state.volume, "%");
            });

            pitchInput.addEventListener("input", (e) => {
                state.pitch = parseInt(e.target.value, 10);
                document.getElementById("val-pitch").textContent = formatSignedParam(state.pitch, "Hz");
            });

            document.getElementById("btn-reset-params").addEventListener("click", () => {
                state.rate = 0;
                state.volume = 0;
                state.pitch = 0;
                rateInput.value = 0;
                volInput.value = 0;
                pitchInput.value = 0;
                document.getElementById("val-rate").textContent = "+0%";
                document.getElementById("val-volume").textContent = "+0%";
                document.getElementById("val-pitch").textContent = "+0Hz";
                showToast("已重置语速、音量和音调为默认值", "info");
            });

            // 6. 示例文本快捷填入与字数统计
            const textArea = document.getElementById("tts-text");
            textArea.addEventListener("input", () => {
                document.getElementById("char-counter").textContent = `${textArea.value.length} characters`;
                state.selectedSample = null;
                renderSampleSelection();
            });

            document.getElementById("btn-clear-text").addEventListener("click", () => {
                textArea.value = "";
                document.getElementById("char-counter").textContent = "0 characters";
                state.selectedSample = null;
                renderSampleSelection();
            });

            document.querySelectorAll(".sample-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const key = btn.getAttribute("data-sample");
                    setSampleText(key);
                });
            });

            // 7. 合成、停止、下载 MP3 与导出 VTT 字幕
            document.getElementById("btn-synthesize").addEventListener("click", handleSynthesizeAndPlay);
            document.getElementById("btn-stop").addEventListener("click", stopAllPlayback);

            document.getElementById("btn-download-mp3").addEventListener("click", () => {
                if (!state.lastAudioBlobUrl || !state.lastSynthesis?.extension) return;
                const a = document.createElement("a");
                a.href = state.lastAudioBlobUrl;
                a.download = `${state.lastSynthesis.voice.ShortName}_${Date.now()}.${state.lastSynthesis.extension}`;
                a.click();
                showToast("Audio download started", "success");
            });

            document.getElementById("btn-download-vtt").addEventListener("click", () => {
                const synthesis = state.lastSynthesis;
                const text = synthesis ? synthesis.text : textArea.value.trim();
                if (!text) {
                    showToast("Enter text or synthesize audio before exporting subtitles", "warning");
                    return;
                }
                const cues = state.subtitlesCueList.length > 0 
                    ? state.subtitlesCueList 
                    : generateEstimatedSubtitles(text, synthesis ? synthesis.rate : state.rate);

                let vttContent = "WEBVTT\n\n";
                cues.forEach((c, idx) => {
                    const start = formatVttTime(c.offset);
                    const end = formatVttTime(c.offset + Math.max(1, c.duration));
                    const cueText = c.text.replace(/[\r\n]+/g, " ").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    vttContent += `${idx + 1}\n${start} --> ${end}\n${cueText}\n\n`;
                });

                const blob = new Blob([vttContent], { type: "text/vtt;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                const subtitleVoice = synthesis?.voice ?? state.selectedVoice;
                a.download = `${subtitleVoice?.ShortName ?? "estimated"}_subtitles.vtt`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast(synthesis && !synthesis.estimated ? "WebVTT subtitles exported" : "WebVTT exported with estimated timing; timing may differ from the audio", "success");
            });

            // 9. 手动或自动同步云端完整语音列表
            document.getElementById("btn-sync-voices").addEventListener("click", syncAllCloudVoices);
            // 页面加载后静默尝试拉取一次全量 320+ 语音列表
            syncAllCloudVoices();
        });
    </script>
</body>
</html>
